<html>

		<title>Sign Up</title>
		<meta charset="UTF-8">
		<meta name ="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<div class="netnav">
    <h1>ProfitPros</h1>
    <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; width: 100%;">
        <div>
            <a href="index.html">HomePage</a>
			<a href="Stock.html">Stocks</a>
			<a href="loss.php">Calculator</a>
			<a href="Contact.html">Contact Us</a>
			<a href="FAQ.html">FAQ</a>
			<a href="Login.html">Login</a>
			<a href="signup.html">Create New Account</a>
        </div>
        
        <!-- User Name (only shows when logged in) -->
        <div id="userInfo" style="display: none; color: #fff; padding: 5px 15px; background: rgba(0,0,0,0.2); border-radius: 5px;">
            <span id="usernameDisplay"></span>
            <button onclick="logout()" style="
                background: #e74c3c;
                color: white;
                border: none;
                padding: 5px 15px;
                border-radius: 5px;
                cursor: pointer;
                margin-left: 10px;
            ">Logout</button>
        </div>
    </div>
</div>

		    <div class="signup-box">
        <form id="signupForm">
            <h2>Sign Up</h2>

            <div class="input-box">
                <span class="icon"></span>
                <input type="email" id="email" required>
                <label>Email</label>
            </div>

            <div class="input-box">
                <span class="icon"></span>
                <input type="password" id="password" required>
                <label>Password (min 8 characters & at least one special symbol)</label>
            </div>
			
			  <div id="passwordStrengthContainer" style="margin-top: 8px;">
                    <div id="strengthBar" style="
                        width: 20%;
                        height: 6px;
                        background: #e0e0e0;
                        border-radius: 3px;
                        overflow: hidden;
                        transition: all 0.3s ease;
                    ">
                        <div id="strengthFill" style="
                            width: 0%;
                            height: 100%;
                            background: #e74c3c;
                            border-radius: 3px;
                            transition: width 0.3s ease;
                        "></div>
                    </div>
                    <div id="strengthText" style="
                        margin-top: 4px;
                        font-size: 12px;
                        color: #666;
                        text-align: right;
                    "></div>
                </div>
            </div>
			
			 <div class="input-box">
                <span class="icon"></span>
                <input type="password" id="confirmPassword" required>
                <label>Confirm Password)</label>
            </div>
			
			  <div id="errorMessage" style="color: red; margin: 10px 0; min-height: 20px;">
			  </div>

                <button type="submit">Register</button>
                <br></br>
				<label>Already Have An Account?</label>
                <a href="login.html">Log In Here</a>
            </div>
        </form>
    </div>
	<script src="signupFunction.js"></script>
	<script src="auth.js"></script>
</body>
</html>
