</head>
<body>
    <div class="netnav">
    <h1>ProfitPros</h1>
    <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; width: 100%;">
        <div>
            <a href="index.html">HomePage</a>
			<a href="Stock.html">Stocks</a>

			<a href="Login.html">Login</a>

        </div>
        
        <!-- User Name (only shows when logged in) -->
        <div id="userInfo" style="display: none; color: #fff; padding: 5px 15px; background: rgba(0,0,0,0.2); border-radius: 5px;">
            <span id="usernameDisplay"></span>
            <button onclick="logout()" style="
                background: #e74c3c;
                color: white;
                border: none;
                padding: 5px 15px;
                border-radius: 5px;
                cursor: pointer;
                margin-left: 10px;
            ">Logout</button>
        </div>
    </div>
</div>

    <div class="login-box">
        <form id="loginForm" action="">
            <h2>Login</h2>

            <div class="input-box">
                <span class="icon"></span>
                <input type="email" id="emailInput" required>
                <label>Email</label>
            </div>

            <div class="input-box">
                <span class="icon"></span>
                <input type="password" id="passwordInput" required>
                <label>Password</label>
            </div>
			<div id="errorMessage" style="color: red; margin-top: 10px;"></div>
            <div id="loginMessage" style="margin-top: 10px;"></div>
                <button type="submit" id="loginBtn">Login</button>
                <label>Don't Have An Account?</label>
                <a href="signup.html">Sign Up Here</a>
            </div>
        </form>
    </div>
    <script src="loginFunction.js"></script>
	<script src="auth.js"></script>
</body>
